<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7ece9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211620" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wardrobe">
  <meta name="description" content="Your closet, today's outfit and a wish list.">
  <title>Wardrobe</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="tee" viewBox="0 0 100 100"><path fill="currentColor" d="M30 15H42Q50 24 58 15H70L92 32 82 46 72 39V88H28V39L18 46 8 32Z"/></symbol>
    <symbol id="sweater" viewBox="0 0 100 100"><path fill="currentColor" d="M32 14H42Q50 22 58 14H68L84 26 94 80 81 83 72 46V88H28V46L19 83 6 80 16 26Z"/></symbol>
    <symbol id="tank" viewBox="0 0 100 100"><path fill="currentColor" d="M34 10H42Q50 28 58 10H66V30Q66 39 74 43V90H26V43Q34 39 34 30Z"/></symbol>
    <symbol id="pants" viewBox="0 0 100 100"><path fill="currentColor" d="M30 8H70L76 94H56L50 36 44 94H24Z"/></symbol>
    <symbol id="shorts" viewBox="0 0 100 100"><path fill="currentColor" d="M26 24H74L82 72H56L50 46 44 72H18Z"/></symbol>
    <symbol id="skirt" viewBox="0 0 100 100"><path fill="currentColor" d="M34 18H66L84 84H16Z"/></symbol>
    <symbol id="dress" viewBox="0 0 100 100"><path fill="currentColor" d="M38 6H44Q50 16 56 6H62L64 34 84 94H16L36 34Z"/></symbol>
    <symbol id="coat" viewBox="0 0 100 100"><path fill="currentColor" d="M34 8H44L50 30 56 8H66L90 28 84 80 72 78V94H28V78L16 80 10 28Z"/></symbol>
    <symbol id="shoe" viewBox="0 0 100 100"><path fill="currentColor" d="M8 66V44Q22 50 34 38L58 56Q84 58 92 68V76H8Z"/></symbol>
    <symbol id="boot" viewBox="0 0 100 100"><path fill="currentColor" d="M26 10H56V50Q82 56 90 70V84H26Z"/></symbol>
    <symbol id="heel" viewBox="0 0 100 100"><path fill="currentColor" d="M12 26Q24 30 30 46L60 66Q84 68 92 76V82H52L30 66 24 62V84H17V58Q10 44 12 26Z"/></symbol>
    <symbol id="bag" viewBox="0 0 100 100"><path fill="currentColor" d="M18 44H82L88 90H12Z"/><path fill="none" stroke="currentColor" stroke-width="5" d="M34 44Q34 14 50 14Q66 14 66 44"/></symbol>
    <symbol id="shades" viewBox="0 0 100 100"><path fill="currentColor" d="M8 38H44V50Q44 64 27 64 10 64 8 50ZM56 38H92V50Q90 64 73 64 56 64 56 50ZM44 42H56V46H44Z"/></symbol>
    <symbol id="hat" viewBox="0 0 100 100"><path fill="currentColor" d="M30 60Q30 28 50 28Q70 28 70 60H94Q94 72 50 72Q6 72 6 60Z"/></symbol>
    <symbol id="gem" viewBox="0 0 100 100"><path fill="none" stroke="currentColor" stroke-width="5" d="M22 14Q22 62 50 66Q78 62 78 14"/><path fill="currentColor" d="M50 62L62 76 50 92 38 76Z"/></symbol>
  </svg>

  <header class="top">
    <h1 id="title">Closet</h1>
    <button class="btn primary small" id="add" data-a="add">Add piece</button>
  </header>

  <main id="main"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-a="tab" data-tab="closet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6.5a1.5 1.5 0 1 1 2.6 1c-.6.6-1.1 1-1.1 2v.5l8.5 6.2c.8.6.4 1.8-.6 1.8H4.1c-1 0-1.4-1.2-.6-1.8L12 10"/></svg>
      <span>Closet</span>
    </button>
    <button data-a="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      <span>Today</span><i class="badge" id="badge" hidden></i>
    </button>
    <button data-a="tab" data-tab="wish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <span>Wish list</span>
    </button>
  </nav>

  <div class="scrim" id="scrim" data-a="close" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
